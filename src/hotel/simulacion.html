<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación de Hotel</title>
    <style>
        /* (Mantenemos tu CSS original igual) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
            border-left: 5px solid;
        }
        .card:hover { transform: translateY(-5px); }
        .card.disponibles { border-left-color: #10b981; }
        .card.ocupadas { border-left-color: #ef4444; }
        .card.limpieza { border-left-color: #f59e0b; }
        .card.mantenimiento { border-left-color: #6b7280; }
        .card-header {
            font-size: 0.9rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .card-value {
            font-size: 3rem;
            font-weight: bold;
            color: #1f2937;
        }
        .card.disponibles .card-value { color: #10b981; }
        .card.ocupadas .card-value { color: #ef4444; }
        .card.limpieza .card-value { color: #f59e0b; }
        .card.mantenimiento .card-value { color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏨 Simulación de Hotel</h1>
        
        <div class="dashboard">
            <div class="card disponibles">
                <div class="card-header">Disponibles</div>
                <!-- AQUÍ VAN LOS IDs -->
                <div id="count-disponibles" class="card-value">6</div>
            </div>
            
            <div class="card ocupadas">
                <div class="card-header">Ocupadas</div>
                <div id="count-ocupadas" class="card-value">4</div>
            </div>
            
            <div class="card limpieza">
                <div class="card-header">Limpieza</div>
                <div id="count-limpieza" class="card-value">2</div>
            </div>
            
            <div class="card mantenimiento">
                <div class="card-header">Mantenimiento</div>
                <div id="count-mantenimiento" class="card-value">2</div>
            </div>
        </div>
    </div>

    <!-- IMPORTANTE: Carga los archivos JS antes de cerrar el body -->
    <script src="server_mock.js"></script>
    <script src="long_polling_client.js"></script>
</body>
</html>
